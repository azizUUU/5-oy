<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>JavaScript funksiyalari</title>
</head>
<body>

    <h1>JavaScript funksiyalari</h1>

    <h2>1. To'rtburchakning yuzi va perimetri</h2>
    <div>
        <input type="number" id="enInput" value="6">
        <input type="number" id="boyInput" value="5">
        <button onclick="hisoblaTortburchak()">Hisoblash</button>
    </div>
    <div class="result" id="tortburchakNatija">Yuzi: 30. Perimetri: 22</div>

    <h2>2. Uchta sondan eng kattasi</h2>
    <div>
        <input type="number" id="num1" value="34">
        <input type="number" id="num2" value="65">
        <input type="number" id="num3" value="23">
        <button onclick="aniqlaEngKattasi()">Aniqlash</button>
    </div>
    <div class="result" id="kattaSonNatija">Eng katta son: 65</div>

    <script>
        function toGriTortburchakYuzi(en, boy) {
            return en * boy;
        }

        function perimetr(en, boy) {
            return 2 * (en + boy);
        }

        function hisoblaTortburchak() {
            let en = Number(document.getElementById('enInput').value);
            let boy = Number(document.getElementById('boyInput').value);

            let s = toGriTortburchakYuzi(en, boy);
            let p = perimetr(en, boy);

            document.getElementById('tortburchakNatija').innerText = `Yuzi: ${s}. Perimetri: ${p}`;
        }
                function engKattaSon(a, b, c) {
            let max = a;
            if (b > max) {
                max = b;
            }
            if (c > max) {
                max = c;
            }
            return max;
        }

        function aniqlaEngKattasi() {
            let n1 = Number(document.getElementById('num1').value);
            let n2 = Number(document.getElementById('num2').value);
            let n3 = Number(document.getElementById('num3').value);

            let max = engKattaSon(n1, n2, n3);

            document.getElementById('kattaSonNatija').innerText = `Eng katta son: ${max}`;
        }
        console.log("Katta son (12, 47, 30):", engKattaSon(12, 47, 30));
        console.log("Katta son (34, 65, 23):", engKattaSon(34, 65, 23)); 
    </script>
</body>
</html>
